<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important Notes - Dr. Robbins</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Lined paper effect for the textarea */
        .ruled-paper {
            background-color: #ffffff;
            background-image: 
                linear-gradient(90deg, transparent 58px, #fca5a5 58px, #fca5a5 60px, transparent 60px),
                repeating-linear-gradient(transparent, transparent 31px, #94a3b8 31px, #94a3b8 32px);
            background-size: 100% 100%, 100% 32px;
            background-attachment: local;
            line-height: 32px;
            font-size: 16px;
            padding: 32px 24px 32px 72px; /* Left padding aligns text with the red margin */
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            resize: vertical;
            min-height: 500px;
            width: 100%;
            outline: none;
            box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.05);
        }

        .ruled-paper:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* Print-specific styling to ensure clean output and strict 1-page fit */
        @media print {
            @page {
                size: letter portrait;
                margin: 0.3in; /* Small margins to maximize vertical space */
            }
            body, html {
                background-color: #ffffff !important;
                margin: 0 !important;
                padding: 0 !important;
                height: 100% !important;
            }
            /* Hide UI elements that shouldn't be printed */
            .no-print {
                display: none !important;
            }
            /* Remove shadows, borders, and backgrounds for a clean paper look */
            .print-clean {
                border: none !important;
                box-shadow: none !important;
                background-color: transparent !important;
            }
            /* Ensure the text inputs look like filled forms on paper */
            input[type="text"], input[type="date"], input[type="tel"] {
                border: none !important;
                border-bottom: 1px solid #cbd5e1 !important;
                border-radius: 0 !important;
                background-color: transparent !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
                box-shadow: none !important;
                height: 1.5rem !important; /* Condense input height */
            }
            .ruled-paper {
                border: none !important;
                box-shadow: none !important;
                height: 100% !important; /* Force textarea to obey flex container */
                max-height: 100% !important;
                overflow: hidden !important; /* Prevent page break overflow */
                resize: none !important; /* Disable resizing in print */
            }
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8 print:p-0 print:m-0 print:h-screen print:overflow-hidden">

    <main class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-clean print:flex print:flex-col print:h-full print:max-h-screen">
        
        <!-- Header Section -->
        <header class="bg-slate-800 text-white p-6 md:p-8 flex flex-col sm:flex-row justify-between items-start sm:items-end border-b-4 border-blue-500 print-clean print:p-4 print:pb-2">
            <div class="mb-4 sm:mb-0">
                <h1 class="text-3xl font-bold tracking-tight text-white print:text-black print:text-2xl">IMPORTANT NOTES</h1>
                <p class="text-slate-300 print:text-slate-700 mt-1 font-medium print:text-sm">To: Dr. Robbins</p>
            </div>
            <div class="text-left sm:text-right">
                <p class="text-sm text-slate-300 print:text-slate-600 uppercase tracking-wider font-semibold print:text-xs">Prepared By</p>
                <p class="text-lg font-medium text-white print:text-black print:text-base">James</p>
            </div>
        </header>

        <form id="noteForm" class="p-6 md:p-8 space-y-8 print-clean print:p-4 print:space-y-4 print:flex-1 print:flex print:flex-col print:overflow-hidden">
            
            <section class="grid grid-cols-1 md:grid-cols-2 gap-6 print:gap-4">
                
                <!-- Today's Date -->
                <div class="space-y-2 print:space-y-0">
                    <label for="currentDate" class="block text-sm font-semibold text-slate-700 print:text-xs">Today's Date</label>
                    <input type="date" id="currentDate" name="currentDate" readonly
                           class="w-full px-4 py-2.5 bg-slate-50 text-slate-800 border border-slate-300 rounded-lg focus:outline-none cursor-default font-medium print:py-0 print:text-sm">
                </div>

                <!-- Patient Name -->
                <div class="space-y-2 print:space-y-0">
                    <label for="patientName" class="block text-sm font-semibold text-slate-700 print:text-xs">Patient Name</label>
                    <input type="text" id="patientName" name="patientName" placeholder="Last Name, First Name" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors print:py-0 print:text-sm">
                </div>

                <!-- Patient DOB -->
                <div class="space-y-2 print:space-y-0">
                    <label for="patientDob" class="block text-sm font-semibold text-slate-700 print:text-xs">Date of Birth</label>
                    <input type="date" id="patientDob" name="patientDob" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-slate-800 print:py-0 print:text-sm">
                </div>

                <!-- Patient Phone -->
                <div class="space-y-2 print:space-y-0">
                    <label for="patientPhone" class="block text-sm font-semibold text-slate-700 print:text-xs">Phone Number</label>
                    <input type="tel" id="patientPhone" name="patientPhone" placeholder="(555) 123-4567" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors print:py-0 print:text-sm">
                </div>

                <!-- Reason for Note -->
                <div class="space-y-2 md:col-span-2 print:space-y-0">
                    <label for="noteReason" class="block text-sm font-semibold text-slate-700 print:text-xs">Reason for Note</label>
                    <input type="text" id="noteReason" name="noteReason" placeholder="e.g., Follow-up, Lab Results, Consultation" 
                           class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors print:py-0 print:text-sm">
                </div>

            </section>

            <section class="space-y-2 print:flex-1 print:flex print:flex-col print:space-y-1 print:min-h-0">
                <label for="explanation" class="block text-sm font-semibold text-slate-700 print:text-xs">Explanation / Detailed Notes</label>
                <textarea id="explanation" name="explanation" class="ruled-paper print:flex-1 print:h-full" placeholder="Begin typing notes here..."></textarea>
            </section>

            <!-- Action Buttons (Hidden when printing via .no-print class) -->
            <section class="flex flex-col-reverse sm:flex-row justify-end sm:space-x-4 gap-4 sm:gap-0 pt-6 border-t border-slate-200 no-print">
                <button type="button" onclick="clearForm()" 
                        class="w-full sm:w-auto px-6 py-3 text-slate-600 bg-slate-100 hover:bg-slate-200 font-medium rounded-lg transition-colors focus:ring-2 focus:ring-slate-300 outline-none">
                    Clear Form
                </button>
                <button type="button" onclick="window.print()" 
                        class="w-full sm:w-auto px-8 py-3 text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg shadow-sm transition-colors flex items-center justify-center space-x-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v3a2 2 0 002 2h1v2a2 2 0 002 2h6a2 2 0 002-2v-2h1a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
                    </svg>
                    <span>Print Note</span>
                </button>
            </section>

        </form>
    </main>

    <!-- Custom Confirm Dialog for Clearing Form -->
    <div id="messageBox" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300 no-print">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 transform scale-95 transition-transform duration-300" id="messageBoxContent">
            <h3 class="text-lg font-bold text-slate-800 mb-2">Clear Form</h3>
            <p class="text-slate-600 mb-6">Are you sure you want to clear all notes? This action cannot be undone.</p>
            <div class="flex justify-end space-x-3">
                <button onclick="closeMessageBox()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors font-medium">Cancel</button>
                <button onclick="confirmClear()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition-colors font-medium">Clear All</button>
            </div>
        </div>
    </div>

    <script>
        const messageBox = document.getElementById('messageBox');
        const messageBoxContent = document.getElementById('messageBoxContent');
        const form = document.getElementById('noteForm');
        const dateField = document.getElementById('currentDate');

        // Automatically set today's date based on user's system time
        function setCurrentDate() {
            if (dateField) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                dateField.value = `${yyyy}-${mm}-${dd}`;
            }
        }
        
        // Initialize date when page loads
        setCurrentDate();

        // Show custom modal instead of default browser alert
        function clearForm() {
            messageBox.classList.remove('hidden');
            messageBox.classList.add('flex');
            
            // Trigger animation frame for CSS transition
            setTimeout(() => {
                messageBox.classList.remove('opacity-0');
                messageBoxContent.classList.remove('scale-95');
            }, 10);
        }

        // Hide custom modal
        function closeMessageBox() {
            messageBox.classList.add('opacity-0');
            messageBoxContent.classList.add('scale-95');
            
            setTimeout(() => {
                messageBox.classList.add('hidden');
                messageBox.classList.remove('flex');
            }, 300);
        }

        // Execute clear action
        function confirmClear() {
            form.reset();
            setCurrentDate(); // Re-apply today's date after resetting
            closeMessageBox();
            
            // Reset textarea height
            const textarea = document.getElementById('explanation');
            textarea.style.height = '500px'; 
        }

        // Auto-expand textarea as the user types
        const tx = document.getElementById("explanation");
        tx.setAttribute("style", "height:" + (tx.scrollHeight) + "px;overflow-y:hidden;");
        tx.addEventListener("input", function() {
            this.style.height = 'auto';
            const newHeight = Math.max(this.scrollHeight, 500);
            this.style.height = newHeight + "px";
        }, false);
    </script>
</body>
</html>
